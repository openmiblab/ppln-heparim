name: heparim
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  # Core data science/UI packages run best when managed by Conda natively:
  - numpy
  - pandas
  - matplotlib
 # This is the proper conda name for 'tkinter'

  - pip:
      - -e .
      - miblab
      - miblab_data
  